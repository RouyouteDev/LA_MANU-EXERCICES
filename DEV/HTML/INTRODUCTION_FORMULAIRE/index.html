<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription simple</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <h1>Formulaire d'inscription</h1>

    <form method="GET">
        <fieldset>
            <legend>1. Informations personnelles</legend>
            <label for="prenom">Prénom:</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
            <label for="mail">Adresse e-mail:</label>
            <input type="email" id="mail" name="mail" placeholder="xxx@lamanu.fr" required>
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
        </fieldset>
        
 
        <fieldset>
            <legend>2. Préférences et Logistique</legend>
            
            <label for="etudes">Niveau d'études:</label>
            <select name="etudes" id="etudes" required>
                <option value="BAC +1">BAC +1</option>
                <option value="BAC +2">BAC +2</option>
                <option value="BAC +3">BAC +3</option>
                <option value="BAC +4">BAC +4</option>
                <option value="BAC +5">BAC +5</option>
                <option value="Chômeur">Chômeur</option>
            </select>
            
            <label for="regime">Régime:</label>
            <select name="regime" id="regime" required>
                <option value="Végétarien">Végétarien</option>
                <option value="Végan">Végan</option>
                <option value="Carnivore">Carnivore</option>
                <option value="Aucun">Aucun</option>
            </select>

            <label for="taille">Tee shirt taille:</label>
            <select name="taille" id="taille" required>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>3. Informations complémentaires</legend>
            <label for="equipe">Taille de l'équipe</label>
            <input type="number" id="equipe" name="equipe" value="1" min="1" max="5" required>
            <label for="birth">Date de naissance:</label>
            <input type="date" id="birth" name="birth" required>
            <label for="commentaire">Commentaire/bio :</label>
            <textarea name="commentaire" id="commentaire" rows="2" cols="25" placeholder="Votre commentaire ici..."></textarea>
        </fieldset>

        <button type="submit" id="submit">Soumettre</button>
    </form>
</body>
</html>
