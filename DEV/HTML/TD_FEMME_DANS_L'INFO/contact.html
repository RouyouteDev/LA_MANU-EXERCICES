<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/contact_phone.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/contact_pccss.css">
</head>
<body>
    <header>
        <h1>Les Femmes et l'informatique</h1>
        <button id="burger_menu">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 18L20 18" stroke="#fffdfd" stroke-width="2" stroke-linecap="round"/>
                <path d="M4 12L20 12" stroke="#fffdfd" stroke-width="2" stroke-linecap="round"/>
                <path d="M4 6L20 6" stroke="#fffdfd" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </header>
    <nav id="navbar">
        <ul id="nav-list">
            <li class="list_elt"><a href="index.html">Accueil</a></li>
            <li class="list_elt"><a href="history.html">Elles ont marqué l'histoire</a></li>
            <li class="list_elt"><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h2>Contactez-nous</h2>
        <form action="form" method="post">
            <fieldset>
                <legend>Contact information</legend>
                <div class="grid">
                    <div class="container">
                        <label for="name">Nom</label>
                        <input type="text" id="name" name="name" placeholder="Exemple: Grenier" required>
                    </div>
                    <div class="container">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" placeholder="Exemple: Wyatt" required>
                    </div>
                    <div class="container big">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
                    </div>
                    <div class="container big">
                        <label for="subject-message">Objet du message</label>
                        <textarea id="subject-message" name="subject-message" rows="1" placeholder="Présentation a une convention..." required></textarea>
                    </div>
                    <div class="container big">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="2" placeholder="On aimerais vous rencontrer.." required></textarea>
                    </div>
                </div>
                <button type="submit">Envoyer</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>© 2026 Les femmes et l’informatique</p>
        <p><a href="legal_mentions.html">Mentions légales</a></p>
        <p><a href="cgu.html">CGU</a></p>
    </footer>
    <script src="./assets/js/burgerMenu.js"></script>
</body>
</html>
